apply from :'config.gradle'
//所有项目配置
allprojects {
    group 'com.caijy.plugin'
    version '1.0'

    // 统一将所有模块的构建输出收拢至项目最外层根目录 build/ 下，并按工程层级分类存放
    def buildSubPath = project == rootProject ? 'root' : (
        project.name.endsWith('-plugin') && project.name != 'monitor-plugin'
            ? "plugins/${project.name}"
            : (project.name.startsWith('monitor-agent') ? "agent/${project.name}" : project.name)
    )
    layout.buildDirectory.set(rootProject.layout.projectDirectory.dir("build/${buildSubPath}"))

    apply plugin: 'idea'
    apply plugin: 'java'
    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

// 根工程 clean 任务：清理最外层统一构建输出目录 build/
tasks.named('clean') {
    delete rootProject.layout.projectDirectory.dir('build')
}


//所有子项目的通用配置
subprojects { subproject ->
    //仓库地址
    repositories {
        mavenLocal()
        mavenCentral()
    }

    //公用依赖
    dependencies {
        // 全局依赖
        implementation rootProject.ext.dependencies["hutool-all"]
        implementation rootProject.ext.dependencies["byte-buddy"]
        implementation rootProject.ext.dependencies["byte-buddy-agent"]
        implementation rootProject.ext.dependencies["slf4j"]
        if (subproject.name != 'monitor-plugin') {
            annotationProcessor rootProject.ext.dependencies["lombok"]
            compileOnly rootProject.ext.dependencies["lombok"]
            testAnnotationProcessor rootProject.ext.dependencies["lombok"]
            testCompileOnly rootProject.ext.dependencies["lombok"]
        }
        // 单测
        testCompileOnly 'junit:junit:4.12'
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}