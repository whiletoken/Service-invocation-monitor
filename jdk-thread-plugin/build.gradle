plugins {
    id 'java'
}

group 'com.caijy.plugin'
version '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(":monitor-agent-core")
}


tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}

tasks.register('packPlugin', Copy) {
    dependsOn tasks.named('jar')
    from layout.buildDirectory.dir('libs')
    into project(":${rootProject.ext.plugin.agentTargetJarModule}").layout.buildDirectory.dir('idea-sandbox/plugins/monitor-plugin/lib/plugins')
}