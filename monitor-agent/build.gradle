plugins {
    id 'java'
    id "com.gradleup.shadow" version "8.3.6"
}

group 'com.caijy.plugin'
version "$rootProject.ext.plugin.version"


repositories {
    mavenCentral()
}


// implementation ==> compile
// compileOnly ==> provided
dependencies {
    implementation project(":monitor-agent-core")
    compileOnly rootProject.ext.dependencies["apache-dubbo"]
    testImplementation rootProject.ext.dependencies["junit"]
}


tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}

shadowJar {
    manifest {
        attributes(
                'Manifest-Version': '1.0',
                'Premain-Class': 'com.caijy.agent.TraceAgent',
                'Can-Redefine-Classes': true,
                'Can-Retransform-Classes': true
        )
    }
}

// 兼容旧版打包任务（现由 PrepareSandboxTask 自动集成）
tasks.register('packAgent', Copy) {
    dependsOn tasks.named('shadowJar')
    from layout.buildDirectory.dir('libs')
    into project(":${rootProject.ext.plugin.agentTargetJarModule}").layout.buildDirectory.dir("idea-sandbox/plugins/${rootProject.ext.plugin.agentTargetJarModule}/lib")
}

